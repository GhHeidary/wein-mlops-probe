# Datei: .github/workflows/ci.yml – in VS Code einfügen und speichern
# Continuous Integration: Tests mit mehreren Python-Versionen.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Jeden Montag um 06:17 Uhr deutscher Zeit
    - cron: "17 6 * * 1"
      timezone: "Europe/Berlin"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Pakete installieren
        run: pip install -r requirements-ci.txt

      - name: Tests ausführen
        run: pytest -v