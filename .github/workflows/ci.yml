# Datei: .github/workflows/ci.yml – in VS Code einfügen und speichern
# Continuous Integration (ab Tag 13 End-to-End): Tests (drei Python-Versionen),
# danach die ganze Pipeline mit Quality Gate, API-Tests (ab Tag 15) und Modell als Artefakt.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Jeden Montag um 06:17 Uhr deutscher Zeit
    - cron: "17 6 * * 1"
      timezone: "Europe/Berlin"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      - name: Python ${{ matrix.python-version }} einrichten
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Pakete installieren
        run: pip install -r requirements-ci.txt

      - name: Tests ausführen
        # Die API-Tests brauchen das Modell. Hier gibt es noch keins -> im Job pipeline.
        run: pytest -v --ignore=tests/test_api.py

  pipeline:
    # End-to-End: Erst wenn alle Tests grün sind, trainiert CI das Modell mit der Pipeline.
    needs: tests
    runs-on: ubuntu-latest
    env:
      DVC_NO_ANALYTICS: "1"
    steps:
      - name: Code holen
        uses: actions/checkout@v7

      - name: Python 3.12 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt

      - name: Pakete installieren
        run: pip install -r requirements-pipeline.txt

      - name: Rohdaten erzeugen
        run: python src/daten_exportieren.py

      - name: Pipeline ausführen
        run: dvc repro --force

      - name: Reproduzierbarkeit prüfen
        run: git diff --exit-code dvc.lock metrics.json reports/validierung.json

      - name: Quality Gate
        run: python src/quality_gate.py

      - name: API-Tests
        # Wir testen die API mit genau dem Modell, das CI gerade gebaut hat.
        run: pytest -v tests/test_api.py

      - name: Modell hochladen
        # Nur ein Modell, das das Quality Gate bestanden hat, wird verpackt.
        uses: actions/upload-artifact@v7
        with:
          name: modell
          path: |
            models/modell.joblib
            metrics.json
            reports/validierung.json
          retention-days: 7