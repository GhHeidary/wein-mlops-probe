# Datei: params.yaml – in VS Code einfügen und speichern
# Parameter der Pipeline. Ändern wir hier etwas, führt dvc repro nur die betroffenen Stufen neu aus.

vorbereiten:
  test_size: 0.2
  random_state: 42

trainieren:
  n_estimators: 2
  max_depth: 2
  random_state: 42

# Ab Tag 13: Mindestwerte für das Quality Gate (gelesen von src/quality_gate.py).
# Diese Werte sind keine Stufe der Pipeline – dvc repro ignoriert sie.
quality_gate:
  min_genauigkeit: 0.90
  min_f1_makro: 0.90