# Datei: environment.yml – in VS Code einfügen und speichern
# Conda-Umgebung fuer den IfaDW-Kurs MLOps (AI Engineer)
#
# Stand: Tag 15 (neu: httpx2 fuer die API-Tests)
# Getestet am 30.10.2026 mit conda 26.9 (Miniforge) unter Linux, Python 3.12.16.
# DVC ergaenzt und getestet am 04.11.2026, pytest am 05.11.2026,
# fastapi und uvicorn am 11.11.2026, httpx2 am 12.11.2026.
#
# Anlegen:        conda env create -f environment.yml
# Aktivieren:     conda activate mlops-kurs
# Aktualisieren:  conda env update -f environment.yml --prune
#
# Hinweis: Wir nutzen nur den Kanal conda-forge.
# Die System-Python-Installation von Linux Mint bleibt unveraendert.
# Weitere Pakete fuer spaetere Unterrichtstage kommen mit einer neuen Version
# dieser Datei dazu.

name: mlops-kurs

channels:
  - conda-forge

dependencies:
  - python=3.12
  - pip
  - pip:
      # Experiment Tracking und Model Registry
      - mlflow==3.17.2
      # Machine Learning und Daten
      - scikit-learn==1.9.1
      - pandas==3.1.0
      - numpy==2.5.4
      - matplotlib==3.11.2
      # Jupyter: Kernel fuer VS Code und Jupyter Notebook
      - ipykernel==7.4.0
      - notebook==7.6.4
      # Daten versionieren und Pipelines (ab Tag 9)
      - dvc==3.67.1
      # Tests (ab Tag 10)
      - pytest==9.2.0
      # Modell-API (ab Tag 14). MLflow bringt beide schon mit,
      # wir schreiben die Versionen hier fest.
      - fastapi==0.162.0
      - uvicorn==0.54.0
      # TestClient fuer die API-Tests (ab Tag 15). Starlette empfiehlt httpx2.
      - httpx2==2.16.0

variables:
  # MLflow sendet sonst anonyme Nutzungsdaten an den Hersteller.
  # Im Kurs schalten wir das aus.
  MLFLOW_DISABLE_TELEMETRY: "true"
  # DVC sendet sonst anonyme Nutzungsdaten. Auch das schalten wir aus.
  DVC_NO_ANALYTICS: "1"